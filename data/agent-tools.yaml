# ── Hidden-gem cohort, imported 2026-09-24 ────────────────────────────────
# Memory/cognition tools land under `framework`; each was fetched and checked
# against its own repository before inclusion. Benchmarks are quoted from the
# projects' own reproducible runs (see notes) rather than their marketing.

- id: mempalace
  name: MemPalace
  category: framework
  description: "Local-first memory for agents that stores conversations verbatim in ChromaDB and organises them into wings, halls and rooms instead of letting an LLM decide what is worth keeping."
  free_limit: "Free — MIT licensed, runs locally with zero API calls"
  requires_card: false
  open_source: true
  license: MIT
  language: python
  platforms: [macos, linux, windows]
  install: "pip install mempalace && mempalace init"
  url: https://github.com/milla-jovovich/mempalace
  stars: 59259
  tags: [memory, rag, local-first, mit, mcp, hidden-gem]
  verified: 2026-09-24
  verified_by: "@hidden-gems-import"
  status: active
  notes:
    - "Co-created by Milla Jovovich and Ben Sigman."
    - "Often quoted as \"100% on benchmarks\" — that is the hybrid pipeline with cloud reranking, which the authors themselves flagged as tuned on failing questions. The defensible numbers are 96.6% R@5 raw on LongMemEval with zero API calls and a 98.4% held-out hybrid score."
    - "The project publicly walked back an overstated \"30x lossless compression\" claim; its experimental AAAK mode actually regresses to 84.2%."

