# Agent skills — packs, catalogs and registries.
#
# Granularity note: one entry per *pack*, not per skill. Listing 39 individual
# OpenAI skills would be 39 near-identical rows and would duplicate a registry
# that already exists; what a reader needs is where skills come from, who
# maintains them, and what they cost (nothing — every entry here is free files).
#
# Verification note: registries that render client-side (skills.sh, skillsmp.com)
# return HTTP 200 for any path at all, including fabricated ones, so a 200 from
# those hosts proves nothing. Only packs whose contents could be listed from a
# real API or a repository tree are counted below, and their counts were read
# from that source on 2026-09-24.

