version: 2
updates:
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Next.js and React must move together or the build breaks.
      next-react:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "eslint-config-next"
      tailwind:
        patterns:
          - "tailwindcss"
          - "postcss"
          - "autoprefixer"
    labels:
      - dependencies
      - website
    commit-message:
      prefix: "chore(deps)"

  # Actions are pinned to SHAs (PRD §16). Dependabot is how those SHAs move.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: monthly
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
