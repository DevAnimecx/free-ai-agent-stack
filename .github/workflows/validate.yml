name: Validate data

# Runs on every PR that touches data, schemas or the scripts that guard them.
# All actions are pinned to commit SHAs (PRD §16, Security).

on:
  pull_request:
    paths:
      - "data/**"
      - "schemas/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"
  push:
    branches: [main]
    paths:
      - "data/**"
      - "schemas/**"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  schema:
    name: Schema, duplicates and URL rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install validation deps
        run: python3 -m pip install --quiet pyyaml jsonschema requests
      - name: Validate every YAML file against its JSON Schema
        id: validate
        run: python3 scripts/validate.py
      - name: Comment the error list on the PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { execSync } = require('child_process');
            let out = '';
            try {
              out = execSync('python3 scripts/validate.py --json', { encoding: 'utf8' });
            } catch (err) {
              out = err.stdout || '';
            }
            let body = '### Data validation failed\n\n';
            try {
              const report = JSON.parse(out);
              const lines = report.errors.slice(0, 40).map(e => `- \`${e}\``);
              if (report.errors.length > 40) lines.push(`- …and ${report.errors.length - 40} more`);
              body += lines.join('\n') || '_no structured output_';
              body += `\n\n**${report.errors.length} error(s), ${report.warnings.length} warning(s)**\n\n`;
            } catch (e) {
              body += '```\n' + out.slice(-3000) + '\n```\n';
            }
            body += 'Fix the errors above, then push again — see CONTRIBUTING.md for the field rules.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  links:
    name: Link reachability (changed entries only)
    runs-on: ubuntu-latest
    needs: schema
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python3 -m pip install --quiet pyyaml jsonschema requests
      - name: Check URLs touched by this PR
        run: python3 scripts/verify_links.py --changed-only

  site:
    name: Site build
    runs-on: ubuntu-latest
    # Runs on every data PR: the export step is what proves a YAML change
    # actually renders, and it is the cheapest way to catch a schema/site drift.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --prefix website
      - name: Export JSON from YAML
        run: python3 scripts/export_json.py
      - name: Static export
        run: npm run build --prefix website
      - name: "Report JS budget (PRD guardrail: <150KB on category pages)"
        run: |
          total=$(du -sk website/out/_next/static/chunks 2>/dev/null | cut -f1 || echo 0)
          echo "Client chunks total: ${total}KB uncompressed" >> "$GITHUB_STEP_SUMMARY"
