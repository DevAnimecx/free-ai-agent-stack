name: Verify links

on:
  schedule:
    - cron: "0 6 * * *" # daily, 06:00 UTC
  workflow_dispatch:
    inputs:
      apply:
        description: "Write status changes back into the YAML"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: verify-links
  cancel-in-progress: false

jobs:
  verify:
    name: Daily link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python3 -m pip install --quiet pyyaml jsonschema requests

      - name: "Check every URL (3 strikes → status: broken)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/verify_links.py --apply --open-issues | tee verify-output.txt

      - name: Validate the data after status changes
        run: python3 scripts/validate.py --quiet

      - name: Commit status changes and link state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data .linkstate.json
          if git diff --cached --quiet; then
            echo "No link-status changes today."
          else
            git commit -m "chore(data): daily link verification $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: link-verification-${{ github.run_number }}
          path: verify-output.txt
          retention-days: 14
