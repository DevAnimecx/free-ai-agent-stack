name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "website/**"
      - "scripts/export_json.py"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python3 -m pip install --quiet pyyaml jsonschema

      - name: Validate before shipping anything
        run: python3 scripts/validate.py --quiet

      - name: YAML → JSON + llms.txt
        run: python3 scripts/export_json.py

      - name: Install website dependencies
        run: npm ci --prefix website

      - name: Build (static export)
        run: npm run build --prefix website
        env:
          # Project pages served from a subpath need it; a custom domain does not.
          BASE_PATH: ${{ vars.BASE_PATH }}

      - name: Report the guardrails
        run: |
          {
            echo "### Build report"
            echo ""
            echo "- Entries exported: $(python3 -c "import json;print(json.load(open('website/public/data/index.json'))['total'])")"
            echo "- Output size: $(du -sh website/out | cut -f1)"
            echo "- JS chunks: $(du -sh website/out/_next/static/chunks | cut -f1) uncompressed"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: website/out

  deploy-pages:
    name: Deploy to GitHub Pages (mirror)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  # Vercel is the primary host (docs/DECISIONS.md D-OQ-2). This step is skipped
  # until the repo has the three secrets below, so a fork or a fresh clone still
  # deploys successfully to Pages.
  deploy-vercel:
    name: Deploy to Vercel (primary)
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Deploy (only if secrets are configured)
        if: env.VERCEL_TOKEN != ''
        run: |
          npx vercel deploy --prod --yes \
            --token "$VERCEL_TOKEN" \
            --build-env NEXT_PUBLIC_SITE_URL=https://freeaiagentstack.dev
        working-directory: website
