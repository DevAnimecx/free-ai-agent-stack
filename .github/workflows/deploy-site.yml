name: Deploy site

# GitHub Pages is the primary host. There is exactly ONE configured value:
#
#   SITE_URL    derived as https://<owner>.github.io/<repo-name>
#
# Everything else follows from it. The base path is the path component of that
# URL, and next.config.js, export_json.py and verify_export.py all derive it the
# same way, so the canonical URL in the markup cannot disagree with the URL the
# site is actually served from — the failure mode that silently splits a site's
# own search ranking. A fork, a rename or a transfer therefore keeps working
# with no repository settings touched.
#
# To move to a custom domain, set ONE repository variable:
#
#   SITE_URL = https://your-domain.com
#
# The base path becomes empty automatically, because it is read from the URL
# rather than tracked as a second setting. This used to be two variables with
# `vars.BASE_PATH || '/<repo>'`, which could not express a root-domain deploy at
# all: GitHub evaluates an empty string as falsy, so setting BASE_PATH to "" —
# the documented way to do it — silently fell back to the subpath and built a
# site whose assets 404 every time.

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "schemas/**"
      - "website/**"
      - "scripts/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-site
  cancel-in-progress: true

env:
  # lowercased: github.repository_owner keeps the account's capitalisation,
  # and a canonical URL should not carry it
  SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', lower(github.repository_owner), lower(github.event.repository.name)) }}

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      # `requests` is not optional here: generate_stats.py imports it, and
      # without it the deploy fails before the build ever starts.
      - run: python3 -m pip install --quiet pyyaml jsonschema pillow requests

      - name: Validate before shipping anything
        run: python3 scripts/validate.py --quiet

      - name: Refresh stats, then YAML → JSON + llms.txt + schemas
        run: |
          python3 scripts/generate_stats.py
          python3 scripts/export_json.py

      - name: Generate Open Graph cards and icons
        run: python3 scripts/generate_brand_assets.py

      - name: Install website dependencies
        run: npm ci --prefix website

      - name: Build (static export)
        run: npm run build --prefix website
        env:
          # Deliberately no BASE_PATH here: next.config.js reads the path
          # component of this URL. Passing both invited them to drift.
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE_URL }}

      # GitHub Pages runs Jekyll by default, and Jekyll ignores every file whose
      # name starts with an underscore — which would silently drop the entire
      # _next/ directory and serve an unstyled site.
      - name: Disable Jekyll
        run: touch website/out/.nojekyll

      # Guardrails, not decoration: these assert the things that are invisible
      # in a browser but decide how the site is indexed. A build that ships a
      # canonical pointing at the wrong host looks perfect and ranks as nothing.
      - name: Verify the deployment will be correct
        run: python3 scripts/verify_export.py

      - name: Report
        run: |
          {
            echo "### Build report"
            echo ""
            echo "- Host: $SITE_URL"
            echo "- Base path: \`$(python3 -c "import os,urllib.parse;print(urllib.parse.urlparse(os.environ['SITE_URL']).path or '/')")\` (derived from SITE_URL)"
            echo "- Entries exported: $(python3 -c "import json;print(json.load(open('website/public/data/index.json'))['total'])")"
            echo "- Output size: $(du -sh website/out | cut -f1)"
            echo "- HTML pages: $(find website/out -name '*.html' | wc -l)"
            echo "- OG cards: $(find website/out/og -name '*.png' | wc -l)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: website/out

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  # Kept for a mirror or a custom domain. Skipped entirely unless the three
  # secrets exist, so a fork or a fresh clone still deploys cleanly to Pages.
  deploy-vercel:
    name: Deploy to Vercel (optional mirror)
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && vars.ENABLE_VERCEL == 'true' }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Deploy (only if secrets are configured)
        if: env.VERCEL_TOKEN != ''
        # The two values look contradictory and are not. Vercel serves the
        # mirror from a ROOT domain, so its own assets must be root-relative —
        # hence the explicit empty BASE_PATH, which overrides the path that
        # would otherwise be read out of SITE_URL. SITE_URL stays the Pages
        # address on purpose: the mirror's canonical tags then point at the one
        # host we want indexed, instead of competing with it for the same
        # content. A mirror that canonicalises to itself is a duplicate.
        run: |
          npx vercel deploy --prod --yes \
            --token "$VERCEL_TOKEN" \
            --build-env NEXT_PUBLIC_SITE_URL="$SITE_URL" \
            --build-env BASE_PATH=""
        working-directory: website
